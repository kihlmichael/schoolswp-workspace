<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0a;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      .title {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #ffffff;
        font-size: 112px;
        font-weight: 700;
        letter-spacing: -2px;
        text-align: center;
      }
      .subtitle {
        position: absolute;
        top: calc(50% + 100px);
        left: 50%;
        transform: translate(-50%, 0);
        color: #888888;
        font-size: 36px;
        font-weight: 400;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="title"
        class="clip title"
        data-start="0"
        data-duration="5"
        data-track-index="0"
      >
        schoolsWP
      </div>
      <div
        id="subtitle"
        class="clip subtitle"
        data-start="0.5"
        data-duration="4.5"
        data-track-index="1"
      >
        HyperFrames — test composition
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#title", { opacity: 0, y: -40, duration: 1, ease: "power3.out" }, 0);
      tl.from(
        "#subtitle",
        { opacity: 0, y: 20, duration: 0.8, ease: "power2.out" },
        0.5,
      );
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
