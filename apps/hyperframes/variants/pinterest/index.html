<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1000, height=1500" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@700;800&family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1000px;
        height: 1500px;
        overflow: hidden;
        background: #12111f;
        font-family:
          "Nunito Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #root {
        position: relative;
        width: 1000px;
        height: 1500px;
      }
      .stage {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        width: 880px;
      }
      .wordmark {
        font-family:
          "Nunito Sans", -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 800;
        font-size: 152px;
        letter-spacing: -4px;
        line-height: 1;
        color: #fafbfd;
      }
      .wordmark .accent {
        color: #00d400;
      }
      .underline {
        margin: 30px auto 40px;
        width: 260px;
        height: 7px;
        border-radius: 4px;
        background: linear-gradient(90deg, #00d400 0%, #e668d4 100%);
        transform-origin: left center;
      }
      .tagline {
        font-family: "Roboto", -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 400;
        font-size: 48px;
        letter-spacing: 0.5px;
        color: #8f8da5;
        line-height: 1.5;
      }
      .tagline-line {
        display: block;
      }
      .tagline .word {
        display: inline-block;
        margin: 0 9px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1000"
      data-height="1500"
    >
      <div class="stage">
        <div
          id="wordmark"
          class="clip wordmark"
          data-start="0"
          data-duration="5"
          data-track-index="0"
        >
          schools<span class="accent">WP</span>
        </div>
        <div
          id="underline"
          class="clip underline"
          data-start="0.6"
          data-duration="4.4"
          data-track-index="1"
        ></div>
        <div class="tagline">
          <span class="tagline-line">
            <span
              id="word-1"
              class="clip word"
              data-start="1.0"
              data-duration="4.0"
              data-track-index="2"
              >WordPress.</span
            >
            <span
              id="word-2"
              class="clip word"
              data-start="1.4"
              data-duration="3.6"
              data-track-index="3"
              >Clair.</span
            >
          </span>
          <span class="tagline-line">
            <span
              id="word-3"
              class="clip word"
              data-start="1.8"
              data-duration="3.2"
              data-track-index="4"
              >Structuré.</span
            >
            <span
              id="word-4"
              class="clip word"
              data-start="2.2"
              data-duration="2.8"
              data-track-index="5"
              >Utile.</span
            >
          </span>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from(
        "#wordmark",
        { opacity: 0, scale: 0.88, duration: 0.6, ease: "power3.out" },
        0,
      );
      tl.from(
        "#underline",
        { scaleX: 0, duration: 0.5, ease: "power2.out" },
        0.6,
      );
      tl.from(
        "#word-1",
        { opacity: 0, y: 20, duration: 0.4, ease: "power2.out" },
        1.0,
      );
      tl.from(
        "#word-2",
        { opacity: 0, y: 20, duration: 0.4, ease: "power2.out" },
        1.4,
      );
      tl.from(
        "#word-3",
        { opacity: 0, y: 20, duration: 0.4, ease: "power2.out" },
        1.8,
      );
      tl.from(
        "#word-4",
        { opacity: 0, y: 20, duration: 0.4, ease: "power2.out" },
        2.2,
      );
      tl.to("#root", { opacity: 0, duration: 0.6, ease: "power2.in" }, 4.4);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
