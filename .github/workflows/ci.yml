name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check core/agents-py/

      - name: Ruff format check
        run: uv run ruff format --check core/agents-py/

      - name: Run tests with coverage
        run: uv run pytest tests/ -v --cov --cov-report=term-missing
