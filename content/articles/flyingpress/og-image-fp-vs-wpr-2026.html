<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>OG FP vs WPR 2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body {
    width: 1200px;
    height: 630px;
    background: linear-gradient(135deg, #1e1b4b 0%, #4F46E5 50%, #7C3AED 100%);
    color: #ffffff;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 50px 70px;
  }
  /* Decorative grid pattern */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 80%, rgba(124, 58, 237, 0.4) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(79, 70, 229, 0.3) 0%, transparent 50%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 1;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .brand-mark {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: #ffffff;
    color: #4F46E5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 18px;
    letter-spacing: -0.04em;
  }
  .year-badge {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  .center {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 18px;
    text-align: center;
    position: relative;
    z-index: 1;
    margin-top: -20px;
  }
  .vs-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    width: 100%;
  }
  .product {
    font-size: 76px;
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1;
    color: #ffffff;
    text-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
  }
  .product .accent {
    color: #FCD34D;
  }
  .vs {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: linear-gradient(135deg, #FCD34D 0%, #F59E0B 100%);
    color: #1e1b4b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 900;
    letter-spacing: -0.02em;
    box-shadow: 0 8px 32px rgba(252, 211, 77, 0.4);
    flex-shrink: 0;
  }
  .tagline {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: rgba(255, 255, 255, 0.92);
    margin-top: 14px;
  }
  .tagline .dot {
    color: #FCD34D;
    margin: 0 14px;
    font-weight: 900;
  }
  .bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 1;
  }
  .verdict {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .trophy {
    font-size: 32px;
    filter: drop-shadow(0 4px 12px rgba(252, 211, 77, 0.5));
  }
  .url {
    background: rgba(255, 255, 255, 0.1);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 500;
    font-family: "SF Mono", "Consolas", "Monaco", monospace;
    letter-spacing: -0.01em;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }
</style>
</head>
<body>
  <div class="top">
    <div class="brand">
      <div class="brand-mark">S</div>
      <span>schoolsWP</span>
    </div>
    <div class="year-badge">Comparatif 2026</div>
  </div>

  <div class="center">
    <div class="vs-row">
      <div class="product">FlyingPress</div>
      <div class="vs">VS</div>
      <div class="product">WP Rocket</div>
    </div>
    <div class="tagline">Vitesse <span class="dot">·</span> Core Web Vitals <span class="dot">·</span> Verdict</div>
  </div>

  <div class="bottom">
    <div class="verdict">
      <span class="trophy">🏆</span>
      <span>Le verdict d'un pro WordPress</span>
    </div>
    <div class="url">schoolswp.com</div>
  </div>
</body>
</html>
