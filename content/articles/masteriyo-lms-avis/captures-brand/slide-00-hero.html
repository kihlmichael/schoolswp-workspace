<!doctype html>

    <title>Masteriyo LMS Avis : Facilité et Interface Intuitive</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "Inter",
          -apple-system,
          system-ui,
          sans-serif;
        background: #f4f5f7;
        color: #0f1419;
      }
      .slide {
        width: 1920px;
        height: 1080px;
        background: #f4f5f7;
        padding: 80px 96px;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        align-items: center;
        gap: 80px;
        position: relative;
        overflow: hidden;
      }
      .slide::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: linear-gradient(90deg, #00d400 0%, #00a300 100%);
      }
      .left {
        display: flex;
        flex-direction: column;
        gap: 32px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: #0f1419;
        color: #ffffff;
        padding: 10px 18px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        width: fit-content;
      }
      .badge-dot {
        width: 9px;
        height: 9px;
        background: #00d400;
        border-radius: 50%;
      }
      .title {
        font-size: 76px;
        font-weight: 800;
        line-height: 1.05;
        color: #0f1419;
        letter-spacing: -0.02em;
      }
      .title strong {
        color: #00d400;
      }
      .subtitle {
        font-size: 26px;
        font-weight: 500;
        line-height: 1.4;
        color: #4b5563;
        max-width: 720px;
      }
      .author {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 18px;
        color: #6b7280;
        font-weight: 500;
        margin-top: 12px;
      }
      .author strong {
        color: #0f1419;
        font-weight: 700;
      }
      .brand-mark {
        color: #00d400;
        font-weight: 700;
      }
      .right {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .illustration-frame {
        width: 100%;
        aspect-ratio: 1 / 1;
        max-width: 640px;
        background: #ffffff;
        border-radius: 32px;
        border: 1px solid rgba(15, 20, 25, 0.08);
        box-shadow:
          0 30px 80px -20px rgba(15, 20, 25, 0.25),
          0 8px 24px -4px rgba(15, 20, 25, 0.1);
        overflow: hidden;
        position: relative;
      }
      .illustration-frame::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: linear-gradient(90deg, #00d400 0%, #00a300 100%);
        z-index: 2;
      }
      .illustration-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="slide">
      <div class="left">

            ><strong>Michaël KIHL</strong> · schools<span class="brand-mark"
              >WP</span

      </div>
      <div class="right">
        <div class="illustration-frame">
          <img
