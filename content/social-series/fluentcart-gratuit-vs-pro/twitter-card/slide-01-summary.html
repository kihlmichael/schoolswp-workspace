<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Twitter Card · FluentCart Gratuit vs Pro · schoolsWP</title>

<link rel="stylesheet" href="_styles.css">
</head>
<body>
  <div class="slide slide--light">
    <div class="slide__left">
      <div class="slide__top">
        <div class="slide__eyebrow">FluentCart · WordPress 2026</div>
        <h1 class="slide__title">
          FluentCart<br>
          Gratuit ou<br>
          <span class="accent">Pro ?</span>
        </h1>
      </div>

      <div class="slide__brand">
        <img src="_assets/logo-schoolswp.svg" alt="schoolsWP" class="slide__logo">
        <div class="slide__brand-tag">Apprends. Exécute. Gagne.</div>
        <div class="slide__url">→ schoolswp.com</div>
      </div>
    </div>

    <div class="slide__right">
      <div class="slide__list-title">Ce que change le Pro</div>
      <div class="slide__list-item">
        <div class="slide__list-num">01</div>
        <div class="slide__list-text">Tunnels de vente.</div>
      </div>
      <div class="slide__list-item">
        <div class="slide__list-num">02</div>
        <div class="slide__list-text">Gestion des licences.</div>
      </div>
      <div class="slide__list-item">
        <div class="slide__list-num">03</div>
        <div class="slide__list-text">Automatisation marketing.</div>
      </div>
      <div class="slide__list-item">
        <div class="slide__list-num">04</div>
        <div class="slide__list-text">Rapports détaillés.</div>
      </div>
      <div class="slide__list-item">
        <div class="slide__list-num">05</div>
        <div class="slide__list-text">Order Bumps conditionnels.</div>
      </div>
    </div>

    <svg class="halftone halftone--br" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots-fctw" x="0" y="0" width="26" height="26" patternUnits="userSpaceOnUse">
          <circle cx="13" cy="13" r="3.5" fill="#00D400" />
        </pattern>
      </defs>
      <rect width="600" height="600" fill="url(#dots-fctw)"/>
    </svg>
  </div>
</body>
</html>
