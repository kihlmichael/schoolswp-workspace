services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/memory.db
      - DECISIONS_DIR=./data/decisions
    volumes:
      - ./data:/app/data
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

networks:
  backend:
    driver: bridge
