<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="400" height="340">
  <defs>
    <style>
      .burger-wrapper { cursor: pointer; }

      #layer-top-bun,
      #layer-lettuce,
      #layer-tomato,
      #layer-patty,
      #layer-cheese,
      #layer-bottom-bun {
        transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .burger-wrapper:hover #layer-top-bun    { transform: translateY(-68px); }
      .burger-wrapper:hover #layer-lettuce    { transform: translateY(-42px); }
      .burger-wrapper:hover #layer-tomato     { transform: translateY(-20px); }
      .burger-wrapper:hover #layer-cheese     { transform: translateY(20px); }
      .burger-wrapper:hover #layer-patty      { transform: translateY(42px); }
      .burger-wrapper:hover #layer-bottom-bun { transform: translateY(68px); }
    </style>

    <radialGradient id="grad-top-bun" cx="50%" cy="35%" r="55%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#F5C87A"/>
      <stop offset="100%" stop-color="#C8842A"/>
    </radialGradient>
    <linearGradient id="grad-bottom-bun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8A84C"/>
      <stop offset="100%" stop-color="#B8721E"/>
    </linearGradient>
    <linearGradient id="grad-patty" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5C3017"/>
      <stop offset="100%" stop-color="#3A1D0A"/>
    </linearGradient>
    <linearGradient id="grad-cheese" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD84D"/>
      <stop offset="100%" stop-color="#F0B820"/>
    </linearGradient>
    <linearGradient id="grad-tomato" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F05252"/>
      <stop offset="100%" stop-color="#C0292A"/>
    </linearGradient>
    <linearGradient id="grad-lettuce" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#72C947"/>
      <stop offset="100%" stop-color="#4A9A22"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
  </defs>

  <g class="burger-wrapper">

    <g id="layer-top-bun" filter="url(#shadow)">
      <path d="M 108,148 Q 100,100 200,92 Q 300,100 292,148 Z"
            fill="url(#grad-top-bun)" stroke="#A86820" stroke-width="1"/>
      <rect x="104" y="146" width="192" height="16" rx="4"
            fill="#D9922E" stroke="#A86820" stroke-width="1"/>
      <ellipse cx="168" cy="118" rx="6" ry="3.5" fill="#E8C06A" transform="rotate(-15,168,118)"/>
      <ellipse cx="200" cy="108" rx="6" ry="3.5" fill="#E8C06A" transform="rotate(5,200,108)"/>
      <ellipse cx="232" cy="118" rx="6" ry="3.5" fill="#E8C06A" transform="rotate(10,232,118)"/>
      <ellipse cx="185" cy="130" rx="5.5" ry="3" fill="#E8C06A" transform="rotate(-8,185,130)"/>
      <ellipse cx="218" cy="128" rx="5.5" ry="3" fill="#E8C06A" transform="rotate(12,218,128)"/>
    </g>

    <g id="layer-lettuce" filter="url(#shadow)">
      <path d="M 96,165 Q 110,152 124,162 Q 138,152 152,163 Q 166,152 180,162 Q 194,152 208,163 Q 222,152 236,162 Q 250,152 264,162 Q 278,152 292,163 Q 304,158 304,168 L 304,174 Q 290,180 276,170 Q 262,180 248,170 Q 234,180 220,170 Q 206,180 192,170 Q 178,180 164,170 Q 150,180 136,170 Q 122,180 108,170 L 96,174 Z"
            fill="url(#grad-lettuce)" stroke="#3A8218" stroke-width="0.8"/>
    </g>

    <g id="layer-tomato" filter="url(#shadow)">
      <rect x="112" y="175" width="176" height="18" rx="6"
            fill="url(#grad-tomato)" stroke="#A02020" stroke-width="0.8"/>
      <line x1="165" y1="177" x2="165" y2="191" stroke="#E07070" stroke-width="1" opacity="0.6"/>
      <line x1="200" y1="177" x2="200" y2="191" stroke="#E07070" stroke-width="1" opacity="0.6"/>
      <line x1="235" y1="177" x2="235" y2="191" stroke="#E07070" stroke-width="1" opacity="0.6"/>
    </g>

    <g id="layer-patty" filter="url(#shadow)">
      <rect x="106" y="207" width="188" height="34" rx="10"
            fill="url(#grad-patty)" stroke="#2A1008" stroke-width="1"/>
      <line x1="140" y1="210" x2="136" y2="238" stroke="#200A00" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
      <line x1="170" y1="210" x2="166" y2="238" stroke="#200A00" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
      <line x1="200" y1="210" x2="196" y2="238" stroke="#200A00" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
      <line x1="230" y1="210" x2="226" y2="238" stroke="#200A00" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
      <line x1="260" y1="210" x2="256" y2="238" stroke="#200A00" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    </g>

    <g id="layer-cheese" filter="url(#shadow)">
      <path d="M 98,204 L 302,204 L 306,210 L 306,216 Q 300,222 294,216 L 290,220 Q 284,225 278,218 L 122,218 Q 116,225 110,220 L 106,216 Q 100,222 94,216 L 94,210 Z"
            fill="url(#grad-cheese)" stroke="#C89010" stroke-width="0.8"/>
    </g>

    <g id="layer-bottom-bun" filter="url(#shadow)">
      <rect x="104" y="243" width="192" height="10" rx="3"
            fill="#D9922E" stroke="#A86820" stroke-width="0.8"/>
      <path d="M 104,251 Q 104,274 200,276 Q 296,274 296,251 L 296,258 Q 296,274 200,276 Q 104,274 104,258 Z"
            fill="url(#grad-bottom-bun)" stroke="#A86820" stroke-width="1"/>
    </g>

  </g>
</svg>
