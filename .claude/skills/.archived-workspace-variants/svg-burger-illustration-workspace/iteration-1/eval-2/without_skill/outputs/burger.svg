<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100" style="cursor:pointer;display:block;">
  <style>
    .layer {
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    svg:hover .bun-top    { transform: translateY(-22px); }
    svg:hover .lettuce    { transform: translateY(-14px); }
    svg:hover .tomato     { transform: translateY(-7px); }
    svg:hover .patty      { transform: translateY(7px); }
    svg:hover .cheese     { transform: translateY(14px); }
    svg:hover .bun-bottom { transform: translateY(22px); }
  </style>

  <g class="layer bun-bottom">
    <rect x="18" y="80" width="84" height="14" rx="7" fill="#D4893A"/>
  </g>

  <g class="layer cheese">
    <rect x="14" y="72" width="92" height="10" rx="2" fill="#F5C842"/>
    <polygon points="14,72 22,72 18,80" fill="#F5C842"/>
    <polygon points="106,72 98,72 102,80" fill="#F5C842"/>
  </g>

  <g class="layer patty">
    <rect x="16" y="60" width="88" height="14" rx="4" fill="#7B3F1E"/>
    <line x1="30" y1="65" x2="90" y2="65" stroke="#6A3418" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="30" y1="69" x2="90" y2="69" stroke="#6A3418" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <g class="layer tomato">
    <rect x="18" y="53" width="84" height="9" rx="2" fill="#E8432D"/>
    <line x1="40" y1="53" x2="40" y2="62" stroke="#C73B27" stroke-width="1" opacity="0.6"/>
    <line x1="60" y1="53" x2="60" y2="62" stroke="#C73B27" stroke-width="1" opacity="0.6"/>
    <line x1="80" y1="53" x2="80" y2="62" stroke="#C73B27" stroke-width="1" opacity="0.6"/>
  </g>

  <g class="layer lettuce">
    <path d="M14,53 Q22,46 30,52 Q38,46 46,52 Q54,46 62,52 Q70,46 78,52 Q86,46 94,52 Q102,46 106,52 L106,56 Q102,52 94,56 Q86,52 78,56 Q70,52 62,56 Q54,52 46,56 Q38,52 30,56 Q22,52 14,56 Z" fill="#5DBB5D"/>
  </g>

  <g class="layer bun-top">
    <path d="M20,50 Q20,28 60,28 Q100,28 100,50 Z" fill="#E8A23A"/>
    <rect x="18" y="48" width="84" height="6" rx="2" fill="#D4893A"/>
    <ellipse cx="45" cy="38" rx="4" ry="2.5" fill="#C87B28" transform="rotate(-20,45,38)"/>
    <ellipse cx="60" cy="34" rx="4" ry="2.5" fill="#C87B28" transform="rotate(5,60,34)"/>
    <ellipse cx="75" cy="38" rx="4" ry="2.5" fill="#C87B28" transform="rotate(15,75,38)"/>
  </g>
</svg>
