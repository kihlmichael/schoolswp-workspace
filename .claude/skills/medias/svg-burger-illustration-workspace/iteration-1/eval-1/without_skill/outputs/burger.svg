<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160" style="display:block;">
  <style>
    .burger-group {
      cursor: pointer;
    }

    .bun-top    { transform: translateY(0px); transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .lettuce    { transform: translateY(0px); transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) 0.03s; }
    .tomato     { transform: translateY(0px); transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) 0.06s; }
    .patty      { transform: translateY(0px); transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) 0.09s; }
    .cheese     { transform: translateY(0px); transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) 0.12s; }
    .bun-bottom { transform: translateY(0px); transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s; }

    .burger-group:hover .bun-top    { transform: translateY(-30px); }
    .burger-group:hover .lettuce    { transform: translateY(-18px); }
    .burger-group:hover .tomato     { transform: translateY(-10px); }
    .burger-group:hover .patty      { transform: translateY(0px); }
    .burger-group:hover .cheese     { transform: translateY(10px); }
    .burger-group:hover .bun-bottom { transform: translateY(20px); }
  </style>

  <g class="burger-group">

    <g class="bun-top">
      <path d="M 40 75 Q 40 30 100 30 Q 160 30 160 75 Z" fill="#D4882A" />
      <ellipse cx="85"  cy="50" rx="5" ry="3" transform="rotate(-20 85 50)"  fill="#B8711F" />
      <ellipse cx="105" cy="43" rx="5" ry="3" transform="rotate(10 105 43)"  fill="#B8711F" />
      <ellipse cx="122" cy="55" rx="5" ry="3" transform="rotate(-10 122 55)" fill="#B8711F" />
      <rect x="40" y="73" width="120" height="8" rx="3" fill="#E8A040" />
    </g>

    <g class="lettuce">
      <path d="M 35 88 Q 50 78 65 85 Q 80 78 95 85 Q 110 78 125 85 Q 140 78 155 85 Q 165 90 165 94 Q 140 86 125 93 Q 110 86 95 93 Q 80 86 65 93 Q 50 86 35 94 Z" fill="#5CB85C" />
    </g>

    <g class="tomato">
      <rect x="42" y="95" width="116" height="10" rx="4" fill="#E8453C" />
      <line x1="75"  y1="95" x2="75"  y2="105" stroke="#C0392B" stroke-width="1" opacity="0.5" />
      <line x1="100" y1="95" x2="100" y2="105" stroke="#C0392B" stroke-width="1" opacity="0.5" />
      <line x1="125" y1="95" x2="125" y2="105" stroke="#C0392B" stroke-width="1" opacity="0.5" />
    </g>

    <g class="patty">
      <rect x="38" y="107" width="124" height="14" rx="5" fill="#7B3F00" />
      <line x1="60"  y1="109" x2="58"  y2="119" stroke="#5C2D00" stroke-width="2" stroke-linecap="round" />
      <line x1="80"  y1="109" x2="78"  y2="119" stroke="#5C2D00" stroke-width="2" stroke-linecap="round" />
      <line x1="100" y1="109" x2="98"  y2="119" stroke="#5C2D00" stroke-width="2" stroke-linecap="round" />
      <line x1="120" y1="109" x2="118" y2="119" stroke="#5C2D00" stroke-width="2" stroke-linecap="round" />
      <line x1="140" y1="109" x2="138" y2="119" stroke="#5C2D00" stroke-width="2" stroke-linecap="round" />
    </g>

    <g class="cheese">
      <path d="M 34 123 L 36 121 L 164 121 L 166 123 L 164 131 L 36 131 Z" fill="#F5C842" />
    </g>

    <g class="bun-bottom">
      <rect x="40" y="131" width="120" height="6" rx="2" fill="#E8A040" />
      <path d="M 40 137 Q 40 152 100 152 Q 160 152 160 137 Z" fill="#D4882A" />
    </g>

  </g>
</svg>
