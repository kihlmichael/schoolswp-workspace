<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    #wrapper {
      cursor: pointer;
    }

    #top-bun {
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #lettuce {
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #tomato {
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #patty {
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #cheese {
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #bottom-bun {
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #wrapper:hover #top-bun {
      transform: translateY(-46px);
    }
    #wrapper:hover #lettuce {
      transform: translateY(-28px);
    }
    #wrapper:hover #tomato {
      transform: translateY(-14px);
    }
    #wrapper:hover #patty {
      transform: translateY(0px);
    }
    #wrapper:hover #cheese {
      transform: translateY(14px);
    }
    #wrapper:hover #bottom-bun {
      transform: translateY(28px);
    }
  </style>

  <g id="wrapper">

    <g id="top-bun">
      <path d="M60,88 Q60,58 100,58 Q140,58 140,88 Z" fill="#D4884A"/>
      <rect x="60" y="86" width="80" height="8" rx="4" fill="#C27840"/>
    </g>

    <g id="lettuce">
      <path
        d="M52,96
           Q58,90 66,96
           Q72,102 80,96
           Q88,90 96,96
           Q104,102 112,96
           Q120,90 128,96
           Q136,102 144,96
           Q150,90 148,100
           L52,100 Z"
        fill="#5CB85C"
      />
    </g>

    <g id="tomato">
      <rect x="58" y="100" width="84" height="10" rx="5" fill="#D9423A"/>
    </g>

    <g id="patty">
      <rect x="62" y="110" width="76" height="22" rx="6" fill="#4A2C1A"/>
    </g>

    <g id="cheese">
      <path
        d="M56,132 L144,132 L148,136 L144,140 L56,140 L52,136 Z"
        fill="#F0C040"
      />
    </g>

    <g id="bottom-bun">
      <rect x="58" y="140" width="84" height="14" rx="7" fill="#D4884A"/>
    </g>

  </g>
</svg>
