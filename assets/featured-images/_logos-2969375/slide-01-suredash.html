<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .slide {
        width: 600px;
        height: 220px;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 26px 40px;
      }
      .slide img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="slide"><img src="suredash.svg" alt="SureDash" /></div>
  </body>
</html>
