<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .slide {
        width: 480px;
        height: 480px;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 96px;
      }
      .slide img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="slide"><img src="fluent-icon.svg" alt="FluentCommunity" /></div>
  </body>
</html>
