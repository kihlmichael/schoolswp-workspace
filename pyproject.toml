[project]
name = "schoolswp-agents"
version = "0.1.0"
description = "schoolsWP OS — Python agents for SEO content production"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
multi-provider = ["openai>=1.0.0"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agents"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["core/agents-py"]
omit = ["*/cli.py", "*/brain_lite_cli.py", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 50
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "raise NotImplementedError",
]

[tool.hatch.build.targets.wheel]
packages = ["core/agents-py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
