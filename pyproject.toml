[project]
name = "schoolswp-agents"
version = "0.1.0"
description = "schoolsWP OS — Python agents for SEO content production"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49.0",
    "python-dotenv>=1.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agents"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
