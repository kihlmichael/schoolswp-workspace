# Canaux de notification
notifications:
  discord:
    enabled: true
    webhook_env: DISCORD_WEBHOOK_ROUTINES
  telegram:
    enabled: true
    bot: "@schoolswp_bot"
    chat_id_env: TELEGRAM_CHAT_ID_MICHAEL
  markdown_archive:
    enabled: true
    path: content/audits/gsc-monthly/

# Seuils d'alerte (notification ROUGE si dépassé sur un pilier)
alerts:
  position_drop: 3       # alerte si position perd 3+ rangs
  clicks_drop_pct: 30    # alerte si clics M-1 baissent de 30%+
  impressions_drop_pct: 40
